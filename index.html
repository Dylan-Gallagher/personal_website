      --fg: #1a1a1a;
      --muted: #6b6b6b;

      --link: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e6e6;
        --muted: #8c8c8c;
        --bg: #111111;
        --link: #e6e6e6;
      }

    * { box-sizing: border-box; }

    body {

      padding: 18vh 1.5rem 4rem;

      color: var(--fg);

      -webkit-font-smoothing: antialiased;

    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 1.25rem; }
    p { margin: 0 0 1rem; }
    .muted { color: var(--muted); }
    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-color: var(--muted);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    a:hover { text-decoration-color: var(--fg); }
    ul { list-style: none; padding: 0; margin: 2rem 0 0; display: flex; gap: 1.25rem; flex-wrap: wrap; }
    footer { margin-top: 4rem; font-size: 0.85rem; }
